<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="sunGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#E58A1F" />
      <stop offset="60%" stop-color="#F5A623" />
      <stop offset="100%" stop-color="#FFD166" />
    </linearGradient>

    <linearGradient id="mapGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3D5A6C" />
      <stop offset="50%" stop-color="#283E4A" />
      <stop offset="100%" stop-color="#1B2A32" />
    </linearGradient>

    <linearGradient id="arrowGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0E8A74" />
      <stop offset="50%" stop-color="#14B89A" />
      <stop offset="100%" stop-color="#2AE8C4" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="subtleShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#1B2A32" flood-opacity="0.22" />
    </filter>
  </defs>

  <g id="KoshalKarobarIcon" filter="url(#subtleShadow)">
    
    <!-- 1. Rising Sun Element -->
    <g id="Sun">
      <!-- Sun Rays -->
      <g stroke="url(#sunGrad)" stroke-width="8" stroke-linecap="round">
        <line x1="250" y1="155" x2="250" y2="90" />
        <line x1="288" y1="165" x2="330" y2="110" />
        <line x1="320" y1="190" x2="385" y2="155" />
        <line x1="212" y1="165" x2="170" y2="110" />
        <line x1="180" y1="190" x2="115" y2="155" />
        <line x1="155" y1="228" x2="90" y2="225" />
      </g>
      <!-- Sun Semi-Circle Body -->
      <path d="M 160,240 A 90,90 0 0,1 340,240 Z" fill="url(#sunGrad)" />
    </g>

    <!-- 2. Stylized Western Odisha / Koshal Landmass Silhouette -->
    <g id="RegionalLandmass">
      <path d="M 125,410 
               C 135,395 140,375 148,355 
               C 155,340 168,330 178,310 
               L 205,325 
               L 245,285 
               L 310,335 
               L 355,270 
               C 362,285 372,305 365,325 
               C 358,345 342,360 330,375 
               C 310,398 285,412 255,420 
               C 220,430 180,432 150,425 
               Z" 
            fill="url(#mapGrad)" 
            stroke="#FFFFFF" 
            stroke-width="3" 
            stroke-linejoin="round" />
    </g>

    <!-- 3. Dynamic Upward Growth Arrow (Business & Market Rise) -->
    <g id="GrowthArrow">
      <path d="M 120,380 
               L 185,305 
               L 250,350 
               L 365,190 
               L 338,188 
               L 395,150 
               L 392,220 
               L 372,205 
               L 255,372 
               L 188,325 
               L 132,390 
               Z" 
            fill="url(#arrowGrad)" 
            stroke="#FFFFFF" 
            stroke-width="4" 
            stroke-linejoin="round" 
            stroke-linecap="round" />
    </g>

  </g>
</svg>
